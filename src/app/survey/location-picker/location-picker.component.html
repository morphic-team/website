<div class="location-picker">
  <div class="location-info mb-2" *ngIf="hasLocation">
    <div class="d-flex justify-content-between align-items-center">
      <small class="text-muted">
        <i class="bi bi-geo-alt"></i> {{ locationDisplay }}
      </small>
      <button 
        type="button" 
        class="btn btn-sm btn-outline-danger"
        (click)="clearLocation()"
        [disabled]="disabled"
        title="Clear location">
        <i class="bi bi-x"></i>
      </button>
    </div>
  </div>
  
  <div class="map-container">
    <div 
      #mapContainer
      [style.height]="options.height || '300px'"
      [style.width]="options.width || '100%'"
      [class.disabled]="disabled">
    </div>
  </div>
  
  <div class="map-instructions mt-2" *ngIf="!disabled">
    <small class="text-muted">
      <i class="bi bi-info-circle"></i>
      {{ hasLocation ? 'Click on the map or drag the marker to change location' : 'Click on the map to select a location' }}
    </small>
  </div>
</div>

<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title mb-0">Create New Search</h3>
        </div>
        <div class="card-body">
          <form [formGroup]="searchForm" (ngSubmit)="onSubmit()">
            <!-- Search Name -->
            <div class="mb-3">
              <label for="name" class="form-label">Search Name <span class="text-danger">*</span></label>
              <input 
                type="text" 
                id="name"
                class="form-control"
                [class.is-invalid]="getFieldError('name')"
                formControlName="name"
                placeholder="Enter a descriptive name for this search">
              <div class="invalid-feedback" *ngIf="getFieldError('name')">
                {{ getFieldError('name') }}
              </div>
            </div>

            <!-- Search Query -->
            <div class="mb-3">
              <label for="search_query" class="form-label">Search Query <span class="text-danger">*</span></label>
              <input 
                type="text" 
                id="search_query"
                class="form-control"
                [class.is-invalid]="getFieldError('search_query')"
                formControlName="search_query"
                placeholder="Enter your Google Images search query">
              <div class="form-text">
                This will be used to search Google Images. Example: "red cars", "mountain landscapes", etc.
              </div>
              <div class="invalid-feedback" *ngIf="getFieldError('search_query')">
                {{ getFieldError('search_query') }}
              </div>
            </div>

            <!-- Comments -->
            <div class="mb-3">
              <label for="comments" class="form-label">Comments</label>
              <textarea 
                id="comments"
                class="form-control"
                rows="3"
                formControlName="comments"
                placeholder="Optional notes about this search..."></textarea>
              <div class="form-text">
                Add any additional notes or context for this search (optional).
              </div>
            </div>

            <!-- Error Message -->
            <div class="alert alert-danger" *ngIf="submitError">
              <i class="bi bi-exclamation-triangle-fill"></i>
              {{ submitError }}
            </div>

            <!-- Form Actions -->
            <div class="d-flex gap-2 justify-content-end">
              <button 
                type="button" 
                class="btn btn-outline-secondary"
                (click)="onCancel()"
                [disabled]="isSubmitting">
                Cancel
              </button>
              <button 
                type="submit" 
                class="btn btn-primary"
                [disabled]="searchForm.invalid || isSubmitting">
                <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                {{ isSubmitting ? 'Creating...' : 'Create Search' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

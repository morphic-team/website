<div class="container-fluid">
    <div class="panel panel-default" *ngIf="survey$ | async as survey">
      <div class="panel-heading">{{ survey.name }} ({{ survey.id }})</div>
      <div class="panel-body">
        <ul class="nav nav-tabs">
          <li role="presentation" routerLinkActive="active">
            <a [routerLink]="['/surveys', survey.id, 'search-results']">Search Results</a>
          </li>
          <li role="presentation" routerLinkActive="active">
            <a [routerLink]="['/surveys', survey.id, 'searches']">Searches</a>
          </li>
          <li role="presentation" routerLinkActive="active">
            <a [routerLink]="['/surveys', survey.id, 'export-results']">Export Results</a>
          </li>
        </ul>
        <router-outlet></router-outlet>  <!-- Placeholder for nested routes -->
      </div>
    </div>
  </div>

<div class="survey-form">
  <div *ngIf="survey.fields.length === 0" class="text-muted text-center p-4">
    <em>No fields to display.</em>
  </div>

  <form *ngIf="survey.fields.length > 0" (ngSubmit)="onSubmit()">
    <div *ngFor="let field of survey.fields; let i = index" class="mb-3">
      <label [for]="'field_' + i" class="form-label">
        {{ field.label }}
        <span *ngIf="field.required" class="text-danger">*</span>
      </label>

      <!-- Text Field -->
      <input *ngIf="field.fieldType === 'text'" 
             type="text" 
             class="form-control" 
             [id]="'field_' + i"
             [(ngModel)]="formValues[getFieldKey(field)]"
             [name]="'field_' + i"
             [required]="!!field.required"
             [disabled]="disabled"
             (ngModelChange)="onFormValueChange()"
             placeholder="Enter text here">

      <!-- Select Field -->
      <select *ngIf="field.fieldType === 'select'" 
              class="form-control" 
              [id]="'field_' + i"
              [(ngModel)]="formValues[getFieldKey(field)]"
              [name]="'field_' + i"
              [required]="!!field.required"
              [disabled]="disabled"
              (ngModelChange)="onFormValueChange()">
        <option value="">-- Select an option --</option>
        <option *ngFor="let option of getOptionsArray(field)" [value]="option">
          {{ option }}
        </option>
      </select>

      <!-- Radio Field -->
      <div *ngIf="field.fieldType === 'radio'" class="form-group">
        <div *ngFor="let option of getOptionsArray(field); let j = index" class="form-check">
          <input type="radio" 
                 class="form-check-input" 
                 [id]="'field_' + i + '_' + j"
                 [name]="'field_' + i"
                 [value]="option"
                 [(ngModel)]="formValues[getFieldKey(field)]"
                 [required]="!!field.required"
                 [disabled]="disabled"
                 (ngModelChange)="onFormValueChange()">
          <label class="form-check-label" [for]="'field_' + i + '_' + j">
            {{ option }}
          </label>
        </div>
      </div>

      <!-- Location Field -->
      <div *ngIf="field.fieldType === 'location'" class="form-group">
        <app-location-picker
          [options]="{
            height: '250px',
            defaultLocation: formValues[getFieldKey(field)] || null,
            disabled: disabled
          }"
          [(ngModel)]="formValues[getFieldKey(field)]"
          [name]="'field_' + i"
          (ngModelChange)="onFormValueChange()">
        </app-location-picker>
        <small class="form-text text-muted">Click on the map to select a location</small>
      </div>

    </div>

    <div *ngIf="showSubmitButton && !disabled" class="mt-4">
      <button type="submit" 
              class="btn btn-primary" 
              [disabled]="!isFormValid()">
        {{ submitButtonText }}
      </button>
    </div>
  </form>
</div>

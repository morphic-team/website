<div class="container-fluid">
  <div class="row">
    <!-- Left Side: Survey Form + Builder -->
    <div class="col-md-6">
      <h1>Create New Survey</h1>
      
      <div class="alert alert-danger" role="alert" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- Survey Basic Info -->
      <div class="card mb-4">
        <div class="card-header">
          <h4>Survey Information</h4>
        </div>
        <div class="card-body">
          <div class="form-group mb-3">
            <label class="control-label" for="nameInput">Survey Name</label>
            <input [(ngModel)]="survey.name" name="name" type="text" class="form-control" id="nameInput" placeholder="Enter survey name" required [disabled]="isSubmitting">
          </div>

          <div class="form-group mb-3">
            <label class="control-label" for="commentsInput">Comments (optional)</label>
            <textarea [(ngModel)]="survey.comments" name="comments" class="form-control" id="commentsInput" rows="3" placeholder="Add any additional notes or description" [disabled]="isSubmitting"></textarea>
          </div>
        </div>
      </div>

      <!-- Survey Builder -->
      <div class="card mb-4">
        <div class="card-header">
          <h4>Survey Fields</h4>
        </div>
        <div class="card-body">
          <app-survey-builder [survey]="survey" (surveyChange)="onSurveyChange($event)"></app-survey-builder>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="form-group">
        <button type="button" class="btn btn-primary" (click)="createSurvey()" [disabled]="isSubmitting">
          <span *ngIf="isSubmitting">Creating...</span>
          <span *ngIf="!isSubmitting">Create Survey</span>
        </button>
        <button type="button" class="btn btn-secondary ms-2" (click)="cancel()" [disabled]="isSubmitting">Cancel</button>
      </div>
    </div>

    <!-- Right Side: Complete Survey Preview -->
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h4>Survey Preview</h4>
        </div>
        <div class="card-body">
          <!-- Survey Header Preview -->
          <div class="mb-4">
            <h2 *ngIf="survey.name; else noName">{{ survey.name }}</h2>
            <ng-template #noName>
              <h2 class="text-muted">Survey Name</h2>
            </ng-template>
            
            <p *ngIf="survey.comments; else noComments" class="text-muted">{{ survey.comments }}</p>
            <ng-template #noComments>
              <p class="text-muted">Survey description will appear here</p>
            </ng-template>
          </div>

          <!-- Survey Fields Preview -->
          <app-survey-preview [survey]="survey"></app-survey-preview>
        </div>
      </div>
    </div>
  </div>
</div>

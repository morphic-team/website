<div class="container">
  <div class="col-md-6 offset-md-3">
    <h1>Create an Account</h1>
    
    <div class="alert alert-danger" role="alert" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="signUp()">
      <div class="form-group">
        <label class="control-label" for="emailInput">Email address</label>
        <input [(ngModel)]="email" name="email" type="email" class="form-control" id="emailInput" placeholder="Enter your email address" required>
      </div>

      <div class="form-group">
        <label class="control-label" for="passwordInput">Password</label>
        <input [(ngModel)]="password" name="password" type="password" class="form-control" id="passwordInput" placeholder="Enter your password (min. 6 characters)" required>
      </div>

      <div class="form-group">
        <label class="control-label" for="confirmPasswordInput">Confirm Password</label>
        <input [(ngModel)]="confirmPassword" name="confirmPassword" type="password" class="form-control" id="confirmPasswordInput" placeholder="Confirm your password" required>
      </div>

      <button type="submit" class="btn btn-primary pull-right">Sign up</button>
      <a routerLink="/sign-in">Already have an account?</a>
    </form>
  </div>
</div>

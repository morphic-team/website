<nav class="navbar navbar-expand bg-light">
  <div class="container-fluid">
    <!-- Brand -->
    <a class="navbar-brand" routerLink="/surveys">
      <span class="bi bi-feather" style="padding-right:4px"></span> Morphic
    </a>

    <!-- Navbar links (always shown for desktop) -->
    <ul class="navbar-nav me-auto">
      <!-- If user is signed in -->
      <li class="nav-item" *ngIf="user$ | async as user">
        <a routerLink="/surveys" routerLinkActive="active" class="nav-link">All Surveys</a>
      </li>

      <!-- If user is not signed in -->
      <li class="nav-item" *ngIf="!(user$ | async)">
        <a routerLink="/sign-in" routerLinkActive="active" class="nav-link">Sign In</a>
      </li>

      <!-- Always show Instructions and Privacy links -->
      <li class="nav-item">
        <a class="nav-link" routerLink="/instructions" routerLinkActive="active">Instructions</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/privacy" routerLinkActive="active">Privacy</a>
      </li>
    </ul>

    <!-- User dropdown on the right -->
    <ul class="navbar-nav ms-auto" *ngIf="user$ | async as user">
      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
          {{ user.emailAddress }} <span class="caret"></span>
        </a>
        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
          <li>
            <a class="dropdown-item" (click)="signOut()" style="cursor: pointer;">
              <span class="bi bi-box-arrow-right" style="padding-right:4px"></span> Logout
            </a>
          </li>
        </ul>
      </li>
    </ul>
  </div>
</nav>
